	<title>{% if page.url == "/" %}{{ site.title }} Conference | {{ site.conference.name }}{% else %}{{ page.title }} - {{ site.title }}{% endif %}</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="description" content="{{ site.description }}" />
	<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
	<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
{%- if site.favicon and site.favicon != "" %}
	<link rel="shortcut icon" href="{{ site.favicon | relative_url }}" />
{%- endif %}
