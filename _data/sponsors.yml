# =============================================================================
#  SPONSORS  (shown at the bottom of the home page)
#
#  Each "- group:" block is one headed section. A group with "logos: []"
#  shows only its heading; delete the whole group to hide the heading too.
#
#    name     sponsor name (used as the image description)
#    url      sponsor website, opened when the logo is clicked
#    image    logo file; put the file in the images/ folder
#    height   largest height of the logo on screen, in pixels
#
#  EXAMPLE - the Sponsors group with one logo:
#
#      - group: "Sponsors"
#        logos:
#          - name: "Example Corporation"
#            url: "https://www.example.com/"
#            image: "/images/example-logo.png"
#            height: 85
# =============================================================================

- group: "Sponsors"
  logos: []

- group: "University Sponsor"
  logos:
    - name: "North Carolina State University"
      url: "https://www.ncsu.edu/"
      image: "/images/NCStateLogo.png"
      height: 50
