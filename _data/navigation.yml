# =============================================================================
#  MENUS
#
#  Each "- id:" block is one button in the dark menu bar at the top.
#  Its "children" are the links in the grey bar underneath, shown on every
#  page that belongs to that menu (a page belongs to a menu when its
#  "menu:" line matches the id here).
#
#    id           short name that pages refer to with "menu: <id>"
#    title        text shown in the menu
#    url          address of the page (must match the page's "permalink:")
#    description  one-line summary shown under the link on the overview page
#                 of the menu (attend.html, program.html, calls.html)
#    shown_when   optional - name of a _data/ file (without ".yml"); the link
#                 stays hidden for as long as that file has no entries
#
#  EXAMPLE - adding a "Student Travel Grants" page to the Attend menu:
#
#      - title: "Travel Grants"
#        url: /grants.html
#        description: "Support for student attendees and how to apply."
# =============================================================================

- id: home
  title: "Home"
  url: /

- id: organizers
  title: "Organizers"
  url: /officers.html
  children:
    - title: "Organizers"
      url: "#organizers"
    # Appears by itself once _data/program_committee.yml has entries.
    - title: "Program Committees"
      url: "#committees"
      shown_when: program_committee

- id: calls
  title: "Call for Papers / Tutorials"
